<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#e8eef4" />
    <title>Conquête</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <button id="back" class="round" aria-label="Retour">‹</button>
      <div id="share" role="img" aria-label="Part des territoires par camp"></div>
      <span id="timer" aria-label="Temps de jeu">0:00</span>
      <button id="pause-btn" class="round small" aria-label="Pause">II</button>
    </div>

    <div id="dock" hidden>
      <button id="auto-toggle" aria-pressed="false">
        <span class="auto-ico" aria-hidden="true">»</span>
        <span>Renforts auto</span>
      </button>
      <div id="auto-opts" hidden>
        <div id="auto" role="group" aria-label="Seuil des renforts automatiques"></div>
        <span id="auto-count" aria-live="polite"></span>
      </div>
    </div>

    <div id="camp-hud" hidden>
      <div class="row">
        <button id="camp-back" class="round" aria-label="Retour au menu">‹</button>
        <div class="pill" id="camp-when"></div>
        <div class="pill" id="camp-gold" aria-label="Or"><i class="coin"></i><span id="gold-n"></span></div>
        <button class="pill pill-btn" id="camp-missions">Missions <b id="mission-n"></b></button>
      </div>
      <div class="row sub">
        <div class="pill small" id="camp-goal"></div>
        <div class="pill small warn" id="camp-threats" hidden></div>
      </div>
    </div>

    <div id="pick-hud" hidden>
      <button id="pick-back" class="round" aria-label="Retour au menu">‹</button>
      <div class="pill">Choisis ta province de départ</div>
    </div>

    <div id="camp-banner" class="pill" hidden></div>

    <div id="camp-panel" class="card" hidden>
      <div class="faction-line"><i id="cp-dot"></i><span id="cp-faction"></span></div>
      <h2 id="cp-name"></h2>
      <div class="chips" id="cp-chips"></div>
      <p id="cp-note"></p>
      <div class="cp-actions">
        <button id="cp-main" class="btn btn-green">Attaquer</button>
        <button id="cp-fort" class="btn btn-gold">Forteresse</button>
        <button id="cp-auto" class="btn btn-gold">Renforts</button>
        <button id="cp-pass" class="btn btn-blue">Passer</button>
      </div>
    </div>

    <div id="menu" class="screen">
      <h1 class="logo"><span>Conquête</span></h1>
      <div class="menu-bottom" id="menu-bottom">
        <div class="pane" id="pane-chapters" role="tabpanel">
          <ol id="track" aria-label="Chapitres"></ol>
          <section class="card">
            <p class="eyebrow" id="m-eyebrow"></p>
            <h2 id="m-title"></h2>
            <p id="m-notion"></p>
          </section>
          <button id="play" class="btn btn-green">Jouer</button>
        </div>

        <div class="pane" id="pane-campaign" role="tabpanel" hidden>
          <div id="scenarios" role="group" aria-label="Scénario"></div>
          <section class="card">
            <p class="eyebrow" id="c-eyebrow">Histoire de France</p>
            <h2 id="c-title"></h2>
            <p id="c-blurb"></p>
          </section>
          <div id="difficulty" role="group" aria-label="Difficulté"></div>
          <p id="diff-note"></p>
          <button id="c-continue" class="btn btn-green">Continuer</button>
          <button id="c-new" class="btn btn-blue">Nouvelle partie</button>
        </div>

        <div class="pane" id="pane-squad" role="tabpanel" hidden>
          <p class="eyebrow" id="sq-camp"></p>
          <div id="sq-stage"></div>
          <div id="sq-grid"></div>
          <section class="card" id="sq-detail"></section>
          <button id="c-journal" class="link">Copier mon journal de jeu</button>
        </div>

        <nav id="tabs" role="tablist" aria-label="Navigation">
          <button id="tab-chapters" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 L16 8 M14 5 L19 5 L19 10 M19 19 L8 8 M10 5 L5 5 L5 10"/></svg><span>Chapitres</span></button>
          <button id="tab-campaign" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6 L9 4 L15 6 L20 4 L20 18 L15 20 L9 18 L4 20 Z M9 4 V18 M15 6 V20"/></svg><span>Campagne</span></button>
          <button id="tab-squad" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 19 Q3 13 9 13 Q15 13 15 19 Z M15 14 Q21 13 21 19 H17"/></svg><span>Escouade</span></button>
        </nav>
      </div>
    </div>

    <div id="chronicle" class="screen" hidden>
      <div class="result">
        <div class="ribbon"><span id="chr-title">Chronique</span></div>
        <div class="panel chr-panel">
          <ul id="chr-lines"></ul>
        </div>
        <div class="actions">
          <button id="chr-ok" class="btn btn-green">Continuer</button>
        </div>
      </div>
    </div>

    <div id="missions" class="screen" hidden>
      <div class="result">
        <div class="ribbon"><span>Missions</span></div>
        <div class="panel chr-panel">
          <ul id="mission-list"></ul>
        </div>
        <div class="actions">
          <button id="missions-ok" class="btn btn-green">Fermer</button>
        </div>
      </div>
    </div>

    <div id="pause" class="screen" hidden>
      <div class="result">
        <div class="ribbon"><span>Pause</span></div>
        <div class="panel pause-panel"><p id="pause-text"></p></div>
        <div class="actions">
          <button id="pause-resume" class="btn btn-green">Reprendre</button>
          <button id="pause-quit" class="btn btn-blue">Quitter</button>
        </div>
      </div>
    </div>

    <div id="overlay" class="screen" hidden>
      <div id="confetti" aria-hidden="true"></div>
      <div class="result">
        <div id="hero"></div>
        <div class="ribbon" id="ribbon"><span id="result"></span></div>
        <div class="panel">
          <div class="stat"><span class="eyebrow">Durée</span><strong id="stat-time"></strong></div>
          <div class="stat"><span class="eyebrow">Territoires</span><strong id="stat-land"></strong></div>
        </div>
        <div class="actions">
          <button id="next" class="btn btn-green">Chapitre suivant</button>
          <button id="replay" class="btn btn-blue">Rejouer</button>
          <button id="to-menu" class="link">Menu</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
